<!DOCTYPE html>
<html lang="en" style="background: #121214 !important; background-color: #121214 !important;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to RIZE - Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #121214;
      --container-fill: #1e1f24;
      --container-fill-hover: #272830;
      --card-bg: #22232a;
      --card-bg-hover: #2c2d36;
      --text-color: #f4effa;
      --hero-text: #ffffff;

      --btn-bg: #d0bcff;
      --btn-text: #211f24;
      --btn-bg-hover: #dfcfff;
      --btn-secondary-bg: #2d2e36;
      --btn-secondary-hover: #373842;

      --slider-track: #36343b;
      --ripple-color: rgba(208, 188, 255, 0.2);
      --font-google-sans: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      text-shadow: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #121214 !important;
      background-color: #121214 !important;
    }

    body {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #121214 !important;
      background-color: #121214 !important;
      color: var(--text-color);
      font-family: var(--font-google-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-app-region: drag;
    }

    .setup-viewport,
    .win-controls {
      -webkit-app-region: no-drag;
    }

    .win-controls {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .win-controls.no-api .win-icon {
      display: none;
    }

    .btn.win-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      justify-content: center;
      border-radius: 50%;
    }

    .btn.win-icon:hover {
      border-radius: 14px;
    }

    body.no-hand-cursor * {
      cursor: default !important;
    }

    body.no-hand-cursor .field {
      cursor: text !important;
    }

    .is-hidden {
      display: none !important;
    }

    .setup-viewport {
      width: 100%;
      max-width: 520px;
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      transition: max-width 0.55s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease, filter 0.5s ease, transform 0.5s ease;
    }

    .setup-viewport::-webkit-scrollbar {
      display: none;
    }

    .setup-viewport[data-step="2"],
    .setup-viewport[data-step="3"],
    .setup-viewport[data-step="4"],
    .setup-viewport[data-step="5"] {
      max-width: 620px;
    }

    .setup-viewport.closing {
      opacity: 0;
      filter: blur(12px);
      transform: scale(0.97);
      pointer-events: none;
    }

    .step-pane {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition:
        opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      filter: blur(0px);
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .step-pane.anim-out-left {
      opacity: 0;
      filter: blur(10px);
      transform: scale(0.96) translateX(-35px);
      pointer-events: none;
    }

    .step-pane.anim-out-right {
      opacity: 0;
      filter: blur(10px);
      transform: scale(0.96) translateX(35px);
      pointer-events: none;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
      user-select: none;
    }

    .hero-stage {
      position: relative;
      width: 230px;
      height: 230px;
      display: grid;
      place-items: center;
      margin-bottom: 6px;
    }

    .hero-stage > * {
      grid-area: 1 / 1;
    }

    .shape {
      width: 100%;
      height: 100%;
      overflow: visible;
      opacity: 0;
    }

    body.intro .shape {
      animation: heroIconAnim 1.9s cubic-bezier(0.1, 0.8, 0.15, 1) forwards;
    }

    .shape-spin {
      animation: shapeSpin 36s linear infinite;
    }

    .shape-path {
      fill: var(--container-fill);
      transition: fill 0.3s ease;
    }

    @keyframes shapeSpin {
      to { transform: rotate(360deg); }
    }

    .icon-wrap {
      width: 120px;
      height: 120px;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 2;
    }

    .riff-icon {
      width: 110px;
      height: 110px;
      display: block;
      border-radius: 26px;
      object-fit: contain;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      opacity: 0;
    }

    body.intro .riff-icon {
      animation: heroIconAnim 1.9s cubic-bezier(0.1, 0.8, 0.15, 1) forwards;
    }

    .riff-title {
      font-size: 68px;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--hero-text);
      display: flex;
      line-height: 1;
      transition: color 0.3s ease;
    }

    .riff-title span {
      display: inline-block;
      opacity: 0;
      transform: translateY(48px) scale(1.4);
      filter: blur(20px);
    }

    body.intro .riff-title span {
      animation: heroLetterAnim 1.9s cubic-bezier(0.1, 0.8, 0.15, 1) forwards;
    }

    .riff-title span:nth-child(1) { animation-delay: 0.9s; }
    .riff-title span:nth-child(2) { animation-delay: 1.05s; }
    .riff-title span:nth-child(3) { animation-delay: 1.2s; }
    .riff-title span:nth-child(4) { animation-delay: 1.35s; }

    body:not(.intro) #step1 .stacked-group {
      opacity: 0;
      pointer-events: none;
    }

    body.intro:not(.intro-done) #step1 .stacked-container {
      animation: containerIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    body.intro:not(.intro-done) #step1 .stacked-container.top { animation-delay: 2.3s; }
    body.intro:not(.intro-done) #step1 .stacked-container.bottom { animation-delay: 2.45s; }

    @keyframes containerIn {
      0% { opacity: 0; transform: translateY(30px) scale(0.97); filter: blur(10px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
    }

    @keyframes heroIconAnim {
      0% { opacity: 0; filter: blur(26px); transform: scale(1.45); }
      100% { opacity: 1; filter: blur(0px); transform: scale(1); }
    }

    @keyframes heroLetterAnim {
      0% { opacity: 0; transform: translateY(48px) scale(1.4); filter: blur(20px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
    }

    .stacked-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .stacked-container {
      background-color: var(--container-fill);
      color: var(--text-color);
      cursor: default;
      user-select: none;
      transition:
        background-color 0.25s ease,
        color 0.25s ease,
        border-radius 0.3s cubic-bezier(0.2, 0, 0, 1);
    }

    .stacked-container.top {
      border-radius: 32px 32px 8px 8px;
      padding: 28px 26px;
    }
    .stacked-container.top:hover {
      background-color: var(--container-fill-hover);
      border-radius: 24px 24px 5px 5px;
    }

    .stacked-container.bottom {
      border-radius: 8px 8px 32px 32px;
      padding: 16px 22px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    .stacked-container.bottom:hover {
      background-color: var(--container-fill-hover);
      border-radius: 5px 5px 24px 24px;
    }

    .stacked-container.stacked-3-top {
      border-radius: 32px 32px 8px 8px;
      padding: 22px 26px;
    }
    .stacked-container.stacked-3-top:hover {
      background-color: var(--container-fill-hover);
      border-radius: 24px 24px 5px 5px;
    }

    .stacked-container.stacked-3-middle {
      border-radius: 8px;
      padding: 18px 26px;
    }
    .stacked-container.stacked-3-middle:hover {
      background-color: var(--container-fill-hover);
      border-radius: 5px;
    }

    .stacked-container.stacked-3-bottom {
      border-radius: 8px 8px 32px 32px;
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stacked-container.stacked-3-bottom:hover {
      background-color: var(--container-fill-hover);
      border-radius: 5px 5px 24px 24px;
    }

    .stacked-container.row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 22px 13px 18px;
    }

    .step-header-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .step-header-subtitle {
      font-size: 15px;
      font-weight: 500;
      opacity: 0.9;
      line-height: 1.4;
    }

    .themes-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 168px));
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .theme-card {
      background-color: var(--card-bg);
      border-radius: 18px;
      padding: 8px;
      cursor: pointer !important;
      pointer-events: auto !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      position: relative;
      transition: background-color 0.2s ease, color 0.2s ease, border-radius 0.2s ease, transform 0.15s ease;
    }

    .theme-card:hover {
      background-color: var(--card-bg-hover);
      border-radius: 14px;
    }

    .theme-card:active {
      transform: scale(0.97);
    }

    .theme-card.active {
      background-color: var(--text-color);
      color: var(--container-fill);
    }

    .theme-card-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      text-align: center;
      pointer-events: none;
    }

    .mockup-window {
      width: 100%;
      height: 78px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      pointer-events: none;
    }

    .mockup-window.mock-dark {
      background-color: #141218;
      --m-surface: #211f26;
      --m-subtle: #2d2a33;
      --m-accent: #d0bcff;
    }
    .mockup-window.mock-light {
      background-color: #fbf8fd;
      --m-surface: #ece5ee;
      --m-subtle: #ded5e1;
      --m-accent: #6750a4;
    }
    .mockup-window.mock-discord {
      background-color: #1e1f22;
      --m-surface: #2b2d31;
      --m-subtle: #383a40;
      --m-accent: #5865f2;
    }
    .mockup-window.mock-light-purple-vibrant {
      background-color: #7943ea;
      --m-surface: #c7b6e9;
      --m-subtle: #b19ddc;
      --m-accent: #ffffff;
    }

    .mock-topbar {
      height: 13px;
      background-color: var(--m-surface);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mock-search {
      width: 48%;
      height: 5px;
      background-color: var(--m-subtle);
      border-radius: 3px;
    }

    .mock-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .mock-sidebar {
      width: 22%;
      background-color: var(--m-surface);
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 4px 3px;
    }

    .mock-item {
      height: 4px;
      border-radius: 2px;
      background-color: var(--m-subtle);
    }
    .mock-item.accent {
      background-color: var(--m-accent);
      width: 75%;
    }

    .mock-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 5px;
    }

    .mock-banner {
      height: 11px;
      border-radius: 3px;
      background-color: var(--m-subtle);
    }

    .mock-row {
      height: 4px;
      border-radius: 2px;
      background-color: var(--m-subtle);
      width: 85%;
    }

    .mock-right {
      width: 26%;
      background-color: var(--m-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px;
    }

    .mock-cover {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      background-color: var(--m-accent);
    }

    .mock-bottombar {
      height: 12px;
      background-color: var(--m-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
    }

    .mock-controls {
      width: 28px;
      height: 4px;
      border-radius: 2px;
      background-color: var(--m-accent);
    }

    .sliders-layout {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .slider-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-color);
      pointer-events: none;
    }

    .sl {
      --v: 0.5;
      position: relative;
      width: 100%;
      height: 28px;
    }

    .sl-active,
    .sl-inactive {
      position: absolute;
      top: 6px;
      height: 16px;
      pointer-events: none;
      transition: background-color 0.3s ease;
    }

    .sl-active {
      left: 0;
      width: max(0px, calc((100% - 6px) * var(--v) + 3px - 8px));
      background-color: var(--text-color);
      border-radius: 8px 3px 3px 8px;
    }

    .sl-inactive {
      right: 0;
      width: max(0px, calc(100% - ((100% - 6px) * var(--v) + 3px) - 8px));
      background-color: var(--slider-track);
      border-radius: 3px 8px 8px 3px;
    }

    .sl input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 28px;
      margin: 0;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer !important;
      pointer-events: auto !important;
      touch-action: none;
    }

    .sl input::-webkit-slider-runnable-track {
      height: 28px;
      background: transparent;
    }

    .sl input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 6px;
      height: 28px;
      border-radius: 3px;
      background-color: var(--text-color);
      cursor: pointer;
      transition: width 0.15s ease, background-color 0.3s ease;
    }

    .sl input:active::-webkit-slider-thumb {
      width: 4px;
    }

    .sl input::-moz-range-track {
      height: 28px;
      background: transparent;
    }

    .sl input::-moz-range-thumb {
      width: 6px;
      height: 28px;
      border-radius: 3px;
      background-color: var(--text-color);
      border: none;
      cursor: pointer;
    }

    .sl.hue::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 6px;
      height: 16px;
      border-radius: 8px;
      background: linear-gradient(to right, #ff4d4d, #ffa64d, #ffff4d, #4dff4d, #4dffff, #4d4dff, #ff4dff, #ff4d4d);
      pointer-events: none;
    }

    .sl.hue .sl-active,
    .sl.hue .sl-inactive {
      display: none;
    }

    .sl.hue input::-webkit-slider-thumb {
      box-sizing: border-box;
      width: 10px;
      border-radius: 5px;
      background-color: #ffffff;
      border: 3px solid var(--text-color);
    }

    .sl.hue input:active::-webkit-slider-thumb {
      width: 8px;
    }

    .sl.hue input::-moz-range-thumb {
      box-sizing: border-box;
      width: 10px;
      border-radius: 5px;
      background-color: #ffffff;
      border: 3px solid var(--text-color);
    }

    .row-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background-color: var(--card-bg);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: background-color 0.25s ease, border-radius 0.25s ease;
    }

    .stacked-container.row:hover .row-icon {
      border-radius: 21px;
    }

    .row-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .row-text {
      flex: 1;
      min-width: 0;
    }

    .row-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .row-sub {
      font-size: 12.5px;
      font-weight: 500;
      opacity: 0.8;
      margin-top: 2px;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sw {
      position: relative;
      width: 52px;
      height: 32px;
      border-radius: 16px;
      background-color: var(--slider-track);
      cursor: pointer !important;
      pointer-events: auto !important;
      flex-shrink: 0;
      transition: background-color 0.25s ease;
    }

    .sw.on {
      background-color: var(--text-color);
    }

    .sw-thumb {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 24px;
      height: 24px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background-color: color-mix(in srgb, var(--text-color) 55%, var(--container-fill));
      color: var(--container-fill);
      transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1), background-color 0.25s ease, color 0.25s ease;
    }

    .sw.on .sw-thumb {
      transform: translateX(20px);
      background-color: var(--container-fill);
      color: var(--text-color);
    }

    .sw:active .sw-thumb {
      transform: scale(1.12);
    }

    .sw.on:active .sw-thumb {
      transform: translateX(20px) scale(1.12);
    }

    .sw-thumb svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .sw-icon {
      d: path("M8 8 L16 16 M16 8 L8 16");
      transition: d 0.18s cubic-bezier(0.2, 0, 0, 1);
    }

    .sw.on .sw-icon {
      d: path("M7.5 12.5 L10.5 15.5 M10.5 15.5 L16.5 8.5");
    }

    .sw:active .sw-icon,
    .sw.on:active .sw-icon {
      d: path("M7 12 L17 12 M12 12 L12 12");
    }

    .sw.disabled {
      opacity: 0.45;
      pointer-events: none !important;
    }

    .launcher-preview {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
    }

    .launcher-tile {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .launcher-tile svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .launcher-name {
      font-size: 15px;
      font-weight: 700;
    }

    .launcher-desc {
      font-size: 12.5px;
      font-weight: 500;
      opacity: 0.8;
      margin-top: 1px;
    }

    .field-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .field {
      flex: 1;
      min-width: 0;
      font-family: var(--font-google-sans);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-color);
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 12px 16px;
      cursor: text !important;
      user-select: text;
      transition: background-color 0.2s ease, border-radius 0.2s ease;
    }

    .field:hover,
    .field:focus {
      background-color: var(--card-bg-hover);
      border-radius: 12px;
    }

    .field::placeholder {
      color: var(--text-color);
      opacity: 0.55;
    }

    .status-line {
      font-size: 12.5px;
      font-weight: 600;
      min-height: 18px;
      margin-top: 8px;
      opacity: 0.85;
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dots i {
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 3px;
      background-color: var(--text-color);
      opacity: 0.3;
      transition: width 0.3s cubic-bezier(0.2, 0, 0, 1), opacity 0.3s ease;
    }

    .dots i.active {
      width: 18px;
      opacity: 0.9;
    }

    .btn {
      position: relative;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-google-sans);
      font-size: 15.5px;
      font-weight: 600;
      padding: 14px 26px;

    const bridge = {
      api: window.electronAPI || null,

      get(key, fallback) {
        try {
          const v = localStorage.getItem(key);
          return v === null ? fallback : v;
        } catch (e) {
          return fallback;
        }
      },

      set(key, value) {
        try {
          localStorage.setItem(key, String(value));
        } catch (e) {}
      },

      async serverPort() {
        if (this.api && this.api.getServerPort) {
          try {
            return await this.api.getServerPort();
          } catch (e) {}
        }
        return null;
      },

      async pickMedia() {
        if (this.api && this.api.pickMedia) {
          try {
            return (await this.api.pickMedia()) || null;
          } catch (e) {
            return null;
          }
        }
        return new Promise((resolve) => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*,video/*';
          input.onchange = () => resolve(input.files[0] ? URL.createObjectURL(input.files[0]) + '#' + encodeURIComponent(input.files[0].name) : null);
          input.click();
        });
      },

      finish(detail) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'votify:welcome-done', detail }, '*');
        }
        if (this.api && this.api.welcomeFinish) this.api.welcomeFinish(detail);
      },

      async launcherInfo() {
        if (this.api && this.api.getLauncherInfo) {
          try {
            return await this.api.getLauncherInfo();
          } catch (e) {}
        }
        return null;
      },

      discordSetEnabled(on) {
        if (this.api && this.api.discordRpcSetEnabled) this.api.discordRpcSetEnabled(on);
      },

      async discordConnected() {
        if (this.api && this.api.discordRpcGetConnected) {
          try {
            return !!(await this.api.discordRpcGetConnected());
          } catch (e) {}
        }
        return false;
      },

      async spotifyLookup(url) {
        const port = await this.serverPort();
        if (!port) return { success: false, error: 'RIZE server is not available here' };
        try {
          const res = await fetch(`http://127.0.0.1:${port}/api/spotify-import?url=${encodeURIComponent(url)}`);
          return await res.json();
        } catch (e) {
          return { success: false, error: 'Could not reach the RIZE server' };
        }
      }

    function triggerRipple(e, el) {
      const rect = el.getBoundingClientRect();
      const circle = document.createElement('span');
      const diameter = Math.max(rect.width, rect.height);
      const radius = diameter / 2;

      let clientX = e.clientX;
      let clientY = e.clientY;

      if (!clientX && !clientY) {
        clientX = rect.left + radius;
        clientY = rect.top + radius;
      }

      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${clientX - rect.left - radius}px`;
      circle.style.top = `${clientY - rect.top - radius}px`;
      circle.classList.add('ripple-wave');

      const oldRipple = el.querySelector('.ripple-wave');
      if (oldRipple) oldRipple.remove();

      el.appendChild(circle);
      circle.addEventListener('animationend', () => circle.remove());
    }

    document.querySelectorAll('.btn').forEach((item) => {

    const SHAPE_K = 360;
    const SHAPE_HOLD_MS = 2000;
    const SHAPE_MORPH_MS = 1250;
    const shapePathEl = document.getElementById('shapePath');
    const shapeProfiles = [];
    let shapeFrom = 0;
    let shapeTo = 0;
    let sizeFrom = 1;
    let sizeTo = 1;
    const shapeHistory = [0];
    let shapeStart = 0;
    let shapeLoopOn = false;

    function buildProfiles() {
      const ns = 'http://www.w3.org/2000/svg';
      const probe = document.createElementNS(ns, 'svg');
      probe.setAttribute('width', '0');
      probe.setAttribute('height', '0');
      probe.style.cssText = 'position:absolute;visibility:hidden';
      document.body.appendChild(probe);

      SHAPE_PATHS.forEach((d) => {
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', d);
        probe.appendChild(path);

        const box = path.getBBox();
        const cx = box.x + box.width / 2;
        const cy = box.y + box.height / 2;
        const total = path.getTotalLength();
        const samples = 1440;
        const angles = [];
        const radii = [];
        let prev = null;
        let acc = 0;

        for (let i = 0; i < samples; i++) {
          const pt = path.getPointAtLength((total * i) / samples);
          const a = Math.atan2(pt.y - cy, pt.x - cx);
          if (prev === null) {
            acc = a;
          } else {
            let delta = a - prev;
            while (delta > Math.PI) delta -= Math.PI * 2;
            while (delta < -Math.PI) delta += Math.PI * 2;
            acc += delta;
          }
          prev = a;
          angles.push(acc);
          radii.push(Math.hypot(pt.x - cx, pt.y - cy));
        }

        if (angles[angles.length - 1] < angles[0]) {
          angles.reverse();
          radii.reverse();
        }

        const start = angles[0];
        const span = Math.PI * 2;
        const profile = new Float32Array(SHAPE_K);
        let maxR = 0;
        let j = 0;

        for (let k = 0; k < SHAPE_K; k++) {
          let theta = -Math.PI + (span * k) / SHAPE_K;
          theta = start + (((theta - start) % span) + span) % span;
          while (j < angles.length - 1 && angles[j + 1] <= theta) j++;
          if (theta < angles[j]) j = 0;
          const a0 = angles[j];
          const r0 = radii[j];
          const a1 = j < angles.length - 1 ? angles[j + 1] : start + span;
          const r1 = j < angles.length - 1 ? radii[j + 1] : radii[0];
          const f = a1 > a0 ? (theta - a0) / (a1 - a0) : 0;
          profile[k] = r0 + (r1 - r0) * Math.min(1, Math.max(0, f));
          if (profile[k] > maxR) maxR = profile[k];
        }

        const scale = 160 / maxR;
        for (let k = 0; k < SHAPE_K; k++) profile[k] *= scale;
        shapeProfiles.push(profile);
      });

      probe.remove();
    }

    function drawShape(rA, rB, t, sA, sB) {
      const size = sA + (sB - sA) * t;
      const pts = [];
      for (let k = 0; k < SHAPE_K; k++) {
        const theta = -Math.PI + (Math.PI * 2 * k) / SHAPE_K;
        const r = (rA[k] + (rB[k] - rA[k]) * t) * size;
        pts.push([Math.cos(theta) * r, Math.sin(theta) * r]);
      }
      let d = `M${((pts[0][0] + pts[SHAPE_K - 1][0]) / 2).toFixed(2)} ${((pts[0][1] + pts[SHAPE_K - 1][1]) / 2).toFixed(2)}`;
      for (let k = 0; k < SHAPE_K; k++) {
        const p = pts[k];
        const n = pts[(k + 1) % SHAPE_K];
        d += `Q${p[0].toFixed(2)} ${p[1].toFixed(2)} ${((p[0] + n[0]) / 2).toFixed(2)} ${((n[1] + p[1]) / 2).toFixed(2)}`;
      }
      shapePathEl.setAttribute('d', d + 'Z');
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function pickNextShape() {
      const recent = shapeHistory.slice(-2);
      const options = shapeProfiles.map((_, i) => i).filter((i) => !recent.includes(i));
      shapeTo = options[Math.floor(Math.random() * options.length)];
      shapeHistory.push(shapeTo);
      let size = sizeFrom;
      while (Math.abs(size - sizeFrom) < 0.09) size = 0.86 + Math.random() * 0.18;
      sizeTo = size;
    }

    function shapeFrame(now) {
      if (!shapeLoopOn) return;
      if (current !== 1 || document.hidden) {
        shapeLoopOn = false;
        return;
      }

      const elapsed = now - shapeStart;
      if (elapsed >= SHAPE_HOLD_MS) {
        shapeFrom = shapeTo;
        sizeFrom = sizeTo;
        pickNextShape();
        shapeStart = now;
      }

      const t = Math.min(1, (now - shapeStart) / SHAPE_MORPH_MS);
      drawShape(shapeProfiles[shapeFrom], shapeProfiles[shapeTo], easeInOutCubic(t), sizeFrom, sizeTo);
      requestAnimationFrame(shapeFrame);
    }

    function startShapeLoop(delay = 600) {
      if (shapeLoopOn || !shapeProfiles.length) return;
      shapeLoopOn = true;
      shapeStart = performance.now() - SHAPE_HOLD_MS + delay;
      requestAnimationFrame(shapeFrame);
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && current === 1) startShapeLoop();
    });

    buildProfiles();
    drawShape(shapeProfiles[0], shapeProfiles[0], 0, 1, 1);

    let introStarted = false;

    function startIntro() {
      if (introStarted) return;
      introStarted = true;
      document.body.classList.add('intro');
      startShapeLoop(2600);
      setTimeout(() => document.body.classList.add('intro-done'), 4200);
    }

    function scheduleIntro() {
      if (document.visibilityState === 'visible') {
        setTimeout(startIntro, 250);
        return;
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') setTimeout(startIntro, 250);
      });
      setTimeout(startIntro, 8000);
    }

    Promise.race([document.fonts.ready, new Promise((resolve) => setTimeout(resolve, 1200))]).then(scheduleIntro, scheduleIntro);

    const SWITCH_HTML = '<span class="sw-thumb"><svg viewBox="0 0 24 24"><path class="sw-icon"/></svg></span>';
    document.querySelectorAll('.sw').forEach((sw) => { sw.innerHTML = SWITCH_HTML; });

    const launcherSwitch = document.getElementById('launcherSwitch');
    const launcherSub = document.getElementById('launcherHeadSub');
    const launcherTitle = document.getElementById('launcherTitle');
    const launcherRowSub = document.getElementById('launcherRowSub');
    let launcherOn = true;
    let launcherAvailable = true;

    function setLauncherUnavailable(text) {
      launcherRowSub.textContent = text;
    }

    async function initLauncher() {
      launcherAvailable = true;
      launcherOn = true;
      launcherSwitch.classList.add('on');
      launcherSwitch.classList.remove('disabled');
      launcherSwitch.setAttribute('aria-checked', 'true');
    }

    launcherSwitch.addEventListener('click', () => {
      launcherOn = !launcherOn;
      launcherSwitch.classList.toggle('on', launcherOn);
      launcherSwitch.setAttribute('aria-checked', launcherOn ? 'true' : 'false');
    });

    initLauncher();

    const finishBtn = document.getElementById('finishBtn');
    const finishBtnText = document.getElementById('finishBtnText');
    let finished = false;

    finishBtn.addEventListener('click', async () => {
      if (finished) return;
      finished = true;

      finishBtnText.textContent = currentLang === 'ru' ? 'Готово!' : 'All Set!';

      if (launcherOn) {
        try {
          await fetch('/api/launcher/install', { method: 'POST' });
        } catch (_) {}
      }

      const detail = {
        launcher: launcherOn,
        lang: currentLang
      };

      bridge.set('votify_welcome_done', '1');
      bridge.set('riff_tutorial_done', 'true');

      setTimeout(() => {
        viewport.classList.add('closing');
        window.dispatchEvent(new CustomEvent('riff:welcome-done', { detail }));
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'votify:welcome-done', detail }, '*');
        }
        setTimeout(() => bridge.finish(detail), 350);
      }, 500);
    });

    document.getElementById('winControls').classList.toggle('no-api', !(bridge.api && bridge.api.closeWindow));
    document.getElementById('winMinBtn').addEventListener('click', () => {
      if (bridge.api && bridge.api.minimizeWindow) bridge.api.minimizeWindow();
    });
    document.getElementById('winCloseBtn').addEventListener('click', () => {
      if (bridge.api && bridge.api.closeWindow) bridge.api.closeWindow();
      bridge.set('votify_welcome_done', '1');
      bridge.finish({ skipped: true });
    });

    document.getElementById('skipBtn').addEventListener('click', () => {
      if (finished) return;
      finished = true;
      bridge.set('votify_welcome_done', '1');
      viewport.classList.add('closing');
      setTimeout(() => bridge.finish({ skipped: true }), 350);
    });

    function setWelcomeLang(lang) {
      currentLang = lang === 'en' ? 'en' : 'ru';
      const isRu = currentLang === 'ru';
      const btnRu = document.getElementById('welcomeLangRu');
      const btnEn = document.getElementById('welcomeLangEn');
      if (btnRu && btnEn) {
        btnRu.style.background = isRu ? '#ffffff' : 'transparent';
        btnRu.style.color = isRu ? '#121214' : 'rgba(255,255,255,0.85)';
        btnRu.style.fontWeight = isRu ? '900' : '700';
        btnEn.style.background = !isRu ? '#ffffff' : 'transparent';
        btnEn.style.color = !isRu ? '#121214' : 'rgba(255,255,255,0.85)';
        btnEn.style.fontWeight = !isRu ? '900' : '700';
      }
      const s1Ru = document.getElementById('slide1LangRu');
      const s1En = document.getElementById('slide1LangEn');
      if (s1Ru && s1En) {
        s1Ru.style.background = isRu ? '#ffffff' : 'transparent';
        s1Ru.style.color = isRu ? '#121214' : 'rgba(255,255,255,0.82)';
        s1Ru.style.fontWeight = isRu ? '900' : '700';
        s1Ru.style.boxShadow = isRu ? '0 2px 10px rgba(0,0,0,0.35)' : 'none';
        s1En.style.background = !isRu ? '#ffffff' : 'transparent';
        s1En.style.color = !isRu ? '#121214' : 'rgba(255,255,255,0.82)';
        s1En.style.fontWeight = !isRu ? '900' : '700';
        s1En.style.boxShadow = !isRu ? '0 2px 10px rgba(0,0,0,0.35)' : 'none';
      }
      const t = document.getElementById('welcomeTitle');
      const s = document.getElementById('welcomeSubtitle');
      const n = document.getElementById('welcomeNextText');
      const skip = document.getElementById('skipBtn');
      const fin = document.getElementById('finishBtnText');
      const back = document.getElementById('backText');
      const lhTitle = document.getElementById('launcherHeadTitle');
      const lhSub = document.getElementById('launcherHeadSub');
      const lTitle = document.getElementById('launcherTitle');
      const lRowSub = document.getElementById('launcherRowSub');
      const lDesc = document.getElementById('launcherDescText');

      if (t) t.textContent = isRu ? 'Добро пожаловать в RIZE.' : 'Welcome to RIZE.';
      if (s) s.textContent = isRu ? 'Быстрый, стильный и удобный плеер без ограничений.' : 'Fast, sleek and borderless music player.';
      if (n) n.textContent = isRu ? 'Продолжить' : 'Continue';
      if (skip) skip.textContent = isRu ? 'Пропустить' : 'Skip';
      if (back) back.textContent = isRu ? 'Назад' : 'Back';
      if (fin) fin.textContent = isRu ? 'Начать' : 'Get Started';
      if (lhTitle) lhTitle.textContent = isRu ? 'Добавить RIZE в меню приложений' : 'Add RIZE to your launcher';
      if (lhSub) lhSub.textContent = isRu ? 'Открывайте RIZE в один клик из меню приложений вашей системы.' : 'Open RIZE in one click from your applications menu.';
      if (lTitle) lTitle.textContent = isRu ? 'Пункт в меню приложений' : 'Applications menu entry';
      if (lRowSub) lRowSub.textContent = isRu ? 'Создает ярлык для запуска RIZE' : 'Creates a launcher that starts RIZE';
      if (lDesc) lDesc.textContent = isRu ? 'Музыкальный плеер' : 'Music player';

      try {
        localStorage.setItem('votify_locale', currentLang);
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'votify:set-lang', lang: currentLang }, '*');
        }
      } catch (_) {}
    }

    document.getElementById('welcomeLangRu')?.addEventListener('click', () => setWelcomeLang('ru'));
    document.getElementById('welcomeLangEn')?.addEventListener('click', () => setWelcomeLang('en'));
    document.getElementById('slide1LangRu')?.addEventListener('click', () => setWelcomeLang('ru'));
    document.getElementById('slide1LangEn')?.addEventListener('click', () => setWelcomeLang('en'));

    const initialLang = localStorage.getItem('votify_locale') || (navigator.language && navigator.language.startsWith('ru') ? 'ru' : 'ru');
    setWelcomeLang(initialLang);
