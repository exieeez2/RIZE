<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIZE — Профиль</title>
<style>
:root{color-scheme:dark;--s:#14110d;--sl:#1a1612;--sc:#1f1b16;--sch:#292420;--schh:#342e29;--p:#f0c070;--op:#3e2a00;--pc:#5a4015;--opc:#ffdea8;--scn:#463a28;--oscn:#f5e3c4;--on:#ede1d3;--onv:#cfc4b4;--ol:#998f80;--olv:#4d453a}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden}
body{background:var(--s);color:var(--on);font:14px/1.45 Roboto,"Google Sans","Segoe UI",system-ui,sans-serif;transition:background .3s}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}
.win{height:100vh;display:flex;flex-direction:column}#v1,#v2{max-width:1100px;margin:0 auto}
.tb{height:36px;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:500;font-size:13px;color:var(--onv)}
.tb .lg{width:20px;height:20px;border-radius:6px;background:var(--p);color:var(--op);display:grid;place-items:center}.tb .lg svg{width:13px;height:13px;stroke-width:2.4}
.tb .sp{flex:1}.tb .wc{display:flex}.tb .wc span{width:40px;height:28px;display:grid;place-items:center;border-radius:8px}.tb .wc svg{width:15px;height:15px}.tb .wc span:hover{background:var(--sch)}
.shell{flex:1;display:flex;min-height:0}
.rail{width:80px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 16px;flex:none}
.fab{width:56px;height:56px;border-radius:18px;border:0;background:var(--pc);color:var(--opc);display:grid;place-items:center;margin:8px 0 18px;box-shadow:0 2px 8px #0005}
.fab:hover{filter:brightness(1.12)}
.ri{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;padding:4px 0;border:0;background:none;color:var(--onv);font-size:12px;font-weight:500}
.ri i{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;font-style:normal;transition:.2s}
.ri:hover i{background:var(--sch)}.ri.on{color:var(--on)}.ri.on i{background:var(--scn);color:var(--oscn)}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;gap:12px;flex:none}
.srch{flex:0 1 560px;margin:0 auto;height:52px;border-radius:26px;background:var(--sch);display:flex;align-items:center;gap:14px;padding:0 18px;color:var(--onv)}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--onv);display:grid;place-items:center;flex:none}
.ib:hover{background:color-mix(in srgb,var(--on) 10%,transparent);color:var(--on)}
.ib.f{background:var(--p);color:var(--op)}.ib.f:hover{filter:brightness(1.1);background:var(--p)}
.me{width:40px;height:40px;border-radius:50%;background:var(--pc);color:var(--opc);display:grid;place-items:center;font-weight:700}
.content{flex:1;min-height:0;background:var(--sl);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--schh) transparent}
.hero{display:flex;gap:28px;align-items:flex-end;padding:28px 44px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 75%,transparent),transparent)}
.av{width:136px;height:136px;border-radius:50%;background:var(--pc);color:var(--opc);display:grid;place-items:center;position:relative;flex:none}
.av>svg{width:60px;height:60px;stroke-width:1.4}
.av .e{position:absolute;right:2px;bottom:2px;width:44px;height:44px;border-radius:50%;background:var(--p);color:var(--op);display:grid;place-items:center;border:4px solid var(--sl);cursor:pointer}.av .e svg{width:18px;height:18px}
.hi{min-width:0;flex:1}
.lbl{font-size:12px;font-weight:500;letter-spacing:.5px;color:var(--p);text-transform:uppercase}
.nick{font-size:clamp(32px,4vw,52px);line-height:1.1;font-weight:500;letter-spacing:-.5px;margin:6px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usr{font-size:16px;color:var(--onv)}
.about{margin-top:10px;font-size:16px;max-width:560px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px 0 10px;border-radius:10px;border:1px solid var(--olv);font-size:13px;font-weight:500;color:var(--on);text-decoration:none;background:none}
.chip svg{width:18px;height:18px;color:var(--p)}.chip.t{background:var(--scn);border-color:transparent;color:var(--oscn)}
a.chip:hover{background:var(--sch)}
.acts{display:flex;gap:10px;padding:8px 44px 0}
.btn{height:40px;padding:0 24px;border-radius:20px;border:0;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;background:none;color:var(--p)}
.btn svg{width:18px;height:18px}.btn.f{background:var(--p);color:var(--op)}.btn.t{background:var(--scn);color:var(--oscn)}.btn.x{padding:0 14px}
.btn:hover{filter:brightness(1.12)}.btn.x:hover{background:color-mix(in srgb,var(--p) 12%,transparent);filter:none}
.cols{padding:4px 44px 44px}
.h{display:flex;justify-content:space-between;align-items:center;margin:14px 0 12px}.h h2{font-size:22px;font-weight:400}.h small{display:block;font-size:12px;color:var(--onv);margin-top:2px}
.pin{display:flex;gap:16px;align-items:center;background:var(--scn);color:var(--oscn);border-radius:24px;padding:14px}
.cv{width:72px;height:72px;border-radius:16px;flex:none}
.pin .t{flex:1;min-width:0}.pin b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pin span{font-size:13px;opacity:.8}
.pin .ib{width:48px;height:48px;color:var(--op)}.pin .ib svg{width:20px;height:20px;fill:currentColor;stroke:none}
.empty{border:1.5px dashed var(--ol);border-radius:24px;padding:28px;text-align:center;color:var(--onv)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,124px));gap:2px;margin:0 -8px}
.pl{padding:8px;border-radius:18px;cursor:pointer;transition:background .15s}.pl:hover{background:var(--sch)}
.pl .c{aspect-ratio:1;border-radius:14px;position:relative}
.pl .pb{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:12px;background:var(--p);color:var(--op);display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:.18s;box-shadow:0 4px 12px #0007}.pl .pb svg{width:15px;height:15px;fill:currentColor;stroke:none}.pl:hover .pb{opacity:1;transform:none}
.pl .n{margin:8px 2px 0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl .m{margin:0 2px;font-size:11px;color:var(--onv)}
/* edit */
.eh{display:flex;align-items:center;gap:8px;padding:20px 24px 0}.eh h1{font-size:28px;font-weight:400}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;padding:8px 44px 8px;max-width:1060px}
.ed .av{width:128px;height:128px;margin:12px 0 22px}.ed .av>svg{width:56px;height:56px}
.tf{position:relative;margin-top:22px}.tf:first-of-type{margin-top:0}
.tf .bx{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--ol);border-radius:14px;padding:0 16px;color:var(--onv);background:var(--sl)}
.tf .bx svg{margin-top:15px;width:22px;height:22px}
.tf input,.tf textarea{flex:1;min-width:0;height:56px;background:none;border:0;outline:0;color:var(--on);font-size:16px;resize:none}.tf textarea{height:92px;padding-top:16px}
.tf label{position:absolute;left:50px;top:17px;font-size:16px;color:var(--onv);pointer-events:none;transition:.15s;padding:0 4px;background:var(--sl);transform-origin:left}
.tf:focus-within label,.tf input:not(:placeholder-shown)~label,.tf textarea:not(:placeholder-shown)~label{top:-9px;left:12px;font-size:12px}
.tf:focus-within label{color:var(--p)}.tf:focus-within .bx{border-color:var(--p);box-shadow:0 0 0 1px var(--p)}
.tf input::placeholder,.tf textarea::placeholder{color:transparent}
.sup{display:flex;justify-content:flex-end;font-size:12px;color:var(--onv);padding:4px 16px 0}
.sec{font-size:14px;font-weight:500;color:var(--p);margin:26px 4px 10px}.sec:first-child{margin-top:0}
.li{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:0;background:var(--sc);border-radius:20px;padding:12px 16px;margin-bottom:8px;color:var(--on)}.li:hover{background:var(--sch)}
.li .lead{width:42px;height:42px;border-radius:50%;background:var(--scn);color:var(--oscn);display:grid;place-items:center;flex:none}
.li .t{flex:1;min-width:0}.li b{display:block;font-size:16px;font-weight:400}.li span.s{font-size:13px;color:var(--onv)}
.pinadd{width:100%;border:1.5px dashed var(--ol);background:none;border-radius:24px;min-height:92px;color:var(--onv);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.pinadd:hover{background:var(--sc);color:var(--on)}
.sws{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;color:#111;background:var(--sch);position:relative}
.sw.s{box-shadow:0 0 0 3px var(--sl),0 0 0 5px var(--p)}.sw svg{width:22px;height:22px;stroke-width:2.4}
.tg{display:flex;align-items:center;gap:14px;padding:6px 4px}.tg .cv{width:44px;height:44px;border-radius:12px}.tg .t{flex:1}.tg b{display:block;font-weight:400;font-size:16px}.tg span{font-size:12px;color:var(--onv)}
.swt{width:52px;height:32px;border-radius:16px;border:2px solid var(--ol);background:var(--schh);position:relative;transition:.2s;flex:none}
.swt::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--ol);transition:.2s}
.swt.on{background:var(--p);border-color:var(--p)}.swt.on::after{left:24px;top:2px;width:24px;height:24px;background:var(--op)}
.ef{display:flex;justify-content:flex-end;gap:8px;padding:12px 44px 40px;max-width:1060px}
/* player */
.pbar{height:76px;background:var(--sc);border-radius:28px;display:flex;align-items:center;padding:0 22px;gap:16px;flex:none}
.cd{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#b08f38,#4a3612);flex:none}
.tt b{display:block;font-weight:500}.tt span{font-size:12px;color:var(--onv)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ctl{display:flex;align-items:center;gap:10px}.ctl .ib svg{width:22px;height:22px}.ctl .ib.f svg{fill:currentColor;stroke:none;width:18px;height:18px}
.seek{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--onv);width:min(420px,100%)}.seek div{flex:1;height:4px;border-radius:2px;background:var(--schh);position:relative}.seek div::after{content:"";position:absolute;left:0;top:0;bottom:0;width:38%;border-radius:2px;background:var(--p)}
.vol{display:flex;align-items:center;gap:8px;color:var(--onv)}.vol div{width:100px;height:4px;border-radius:2px;background:var(--schh);position:relative}.vol div::after{content:"";position:absolute;left:0;top:0;bottom:0;width:60%;border-radius:2px;background:var(--p)}
/* dialog */
.mask{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:10}.mask.o{display:flex}
.dlg{width:420px;max-height:84vh;overflow:auto;background:var(--schh);border-radius:28px;padding:24px;box-shadow:0 12px 40px #000a}.dlg h3{font-size:24px;font-weight:400;margin-bottom:16px}
.opt{display:flex;gap:14px;align-items:center;padding:8px;border-radius:16px;cursor:pointer}.opt:hover{background:var(--sch)}.opt.s{background:var(--scn)}.opt .cv{width:48px;height:48px;border-radius:12px}.opt b{display:block;font-weight:500}.opt span{font-size:12px;color:var(--onv)}
.da{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.snack{position:fixed;left:24px;bottom:24px;background:var(--on);color:var(--s);padding:14px 20px;border-radius:12px;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:20}.snack.s{opacity:1;transform:none}
@media(max-width:900px){.rail{display:none}.col{padding-left:12px}.cols,.ed{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.srch{flex:1}.pbar .vol,.pbar .tt{display:none}.snack{left:20px}}
</style></head><body>

 <div class="shell">
  <div class="col">
   <div class="content" id="main">

    <div id="v1">
     <div class="hero">
      <div class="av"><span data-i="user" style="display:contents"></span><div class="e" id="av1" data-i="pen"></div></div>

       <div class="lbl">Профиль</div>

     <div class="cols">
      <div><div class="h"><h2>Плейлисты<small id="sv">Все изменения сохранены</small></h2></div><div class="grid" id="grid"></div></div>
      <div style="max-width:440px"><div class="h"><h2>Закреплённый трек</h2><button class="btn x" id="chg">Изменить</button></div><div id="pp"></div></div>
     </div>
    </div>

    <div id="v2" class="hide">

      <div>
       <div class="av"><span data-i="user" style="display:contents"></span><div class="e" id="av2" data-i="pen"></div></div>

       <div class="tf"><div class="bx"><span data-i="at" style="display:contents"></span><input id="fu" maxlength="12" placeholder=" " autocapitalize="off"><label>Юзернейм</label></div><div class="sup" id="cn2"></div></div>

       <div class="tf"><div class="bx"><span data-i="smile" style="display:contents"></span><input id="fs" maxlength="32" placeholder=" "><label>Статус — что нового?</label></div><div class="sup" id="cn4"></div></div>
      </div>
      <div>
       <div class="sec">Интеграции</div>
       <button class="li" data-k="tg"><span class="lead" data-i="tg"></span><div class="t"><b>Telegram</b><span class="s" id="vtg"></span></div><span data-i="chev" style="display:contents"></span></button>
       <button class="li" data-k="ds"><span class="lead" data-i="ds"></span><div class="t"><b>Discord</b><span class="s" id="vds"></span></div><span data-i="chev" style="display:contents"></span></button>
       <button class="li" data-k="site"><span class="lead" data-i="link"></span><div class="t"><b>Сайт</b><span class="s" id="vsite"></span></div><span data-i="chev" style="display:contents"></span></button>
       <div class="sec">Закреп</div><div id="pinslot"></div>
       <div class="sec">Цвет профиля</div><div class="sws" id="cols"></div>
       <div class="sec">Плейлисты в профиле</div><div id="ptg"></div>
       <button class="li" id="prem" style="margin-top:14px"><span class="lead" data-i="aa"></span><div class="t"><b>Кастомизация никнейма</b><span class="s">Требуется подписка</span></div><span data-i="crown" style="display:contents;color:var(--p)"></span></button>
      </div>
     </div>
     <div class="ef"><button class="btn x" id="back">Назад</button><button class="btn f" id="save">Сохранить</button></div>
    </div>

   </div>
  </div>
 </div>
</div>
<div class="mask" id="mask"><div class="dlg" id="dlg"></div></div><div class="snack" id="toast"></div>

<script>
var $=function(i){return document.getElementById(i)};
var IC={logo:'<path d="M5 4h6l-6 8h8M13 12l6 8h-6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',at:'<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 006 0v-1a10 10 0 10-4 8"/>',quote:'<path d="M5 8h4v4c0 3-1.5 4.5-4 5M14 8h4v4c0 3-1.5 4.5-4 5"/>',smile:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 007 0M9 9.5h.01M15 9.5h.01"/>',tg:'<path d="M21 4L3 11l6 2 2 6 3-4 5 4z"/>',ds:'<rect x="3" y="6" width="18" height="12" rx="5"/><path d="M9 12h.01M15 12h.01"/>',link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',chev:'<path d="M9 5l7 7-7 7"/>',music:'<path d="M9 18V6l10-2v11M9 18a3 3 0 11-3-3 3 3 0 013 3zm10-3a3 3 0 11-3-3 3 3 0 013 3z"/>',aa:'<path d="M3 19L9 5l6 14M5 14h8M17 19v-7M17 14a3 3 0 100 5"/>',crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',ban:'<circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/>',pen:'<path d="M4 20l1-4L16 5l3 3L8 19z"/>',play:'<path d="M7 4l13 8-13 8z"/>',back:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',min:'<path d="M5 12h14"/>',max:'<rect x="5" y="5" width="14" height="14" rx="2"/>',search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',home:'<path d="M4 11l8-7 8 7v9H4z"/>',lib:'<path d="M6 4v16M11 4v16M16 5l4 15"/>',heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.600-7 10-7 10z"/>',plus:'<path d="M12 5v14M5 12h14"/>',shuf:'<path d="M4 7h4l8 10h4M4 17h4l3-4M16 7h4M18 5l2 2-2 2M18 15l2 2-2 2"/>',prev:'<path d="M7 5v14M19 5L9 12l10 7z"/>',next:'<path d="M17 5v14M5 5l10 7-10 7z"/>',rep:'<path d="M4 11V9a2 2 0 012-2h13M16 4l3 3-3 3M20 13v2a2 2 0 01-2 2H5M8 20l-3-3 3-3"/>',vol:'<path d="M4 9v6h4l5 4V5L8 9zM17 9a4 4 0 010 6"/>',up:'<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>',check:'<path d="M5 12l5 5 9-10"/>'};

 for(var k in m)r.setProperty(k,m[k])}

var tracks=[{t:"sleep mode",a:"ONDA ANDAR",g:"linear-gradient(135deg,#2fb4e6,#0a5d85)"},{t:"OOOO",a:"ALBLAK 52",g:"linear-gradient(135deg,#b08f38,#4a3612)"},{t:"псы попадут в рай",a:"плм",g:"linear-gradient(135deg,#ef4a38,#7c1510)"},{t:"The Dark Triad",a:"Various Artists",g:"linear-gradient(135deg,#a02424,#2b0a0a)"}];
var pls=[{n:"Избранное",c:3,g:"linear-gradient(135deg,#f4f4f4,#aab6c4)",on:true},{n:"exieeez",c:94,g:"linear-gradient(135deg,#ef4a38,#8c1b14)",on:true},{n:"Мои треки (1)",c:100,g:"linear-gradient(135deg,#7dc0e0,#1d4e6e)",on:true}];
var st={nick:"exieeez",user:"god",about:"",status:"",tg:"",ds:"",site:"http://raze.pp.ua/",pin:null,color:""},dr;
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("s");setTimeout(function(){t.classList.remove("s")},2000)}
function plr(c){return c%10===1&&c%100!==11?" трек":(c%10>1&&c%10<5&&(c%100<10||c%100>20)?" трека":" треков")}
function su(u){u=(u||"").trim();if(u&&!/^https?:\/\//i.test(u))u="https://"+u;return u}
function view(n){$("v1").classList.toggle("hide",n!==1);$("v2").classList.toggle("hide",n!==2);$("main").scrollTop=0}
function pinHtml(t,del){return '<div class="pin"><div class="cv" style="background:'+t.g+'"></div><div class="t"><b>'+t.t+'</b><span>'+t.a+'</span></div>'+(del?'<button class="ib" id="unpin" style="color:var(--oscn)">'+ic('x')+'</button>':'<button class="ib f">'+ic('play')+'</button>')+'</div>'}
function render(){
 pal(hueOf(st.color));
 $("pn").textContent=st.nick;$("pu").textContent="@"+st.user;
 $("pa").classList.toggle("hide",!st.about);$("pa").textContent=st.about;
 var u=su(st.site),ch="";
 if(st.status)ch+='<span class="chip t">'+ic('smile')+'<span data-t="status"></span></span>';
 if(st.tg)ch+='<span class="chip">'+ic('tg')+'<span data-t="tg"></span></span>';
 if(st.ds)ch+='<span class="chip">'+ic('ds')+'<span data-t="ds"></span></span>';
 if(u)ch+='<a class="chip" target="_blank" rel="noopener" href="'+u+'">'+ic('link')+'<span data-t="site"></span></a>';
 $("pch").innerHTML=ch;$("pch").querySelectorAll("[data-t]").forEach(function(s){var k=s.dataset.t;s.textContent=k==="site"?u.replace(/^https?:\/\//,"").replace(/\/$/,""):st[k]});
 $("pp").innerHTML=st.pin!==null?pinHtml(tracks[st.pin]):'<div class="empty">Ничего не закреплено</div>';
 var v=pls.filter(function(p){return p.on});
 $("grid").innerHTML=v.length?v.map(function(p){return '<div class="pl"><div class="c" style="background:'+p.g+'"><div class="pb">'+ic('play')+'</div></div><div class="n">'+p.n+'</div><div class="m">Плейлист • '+p.c+plr(p.c)+'</div></div>'}).join(""):'<div class="empty" style="margin:0 10px;grid-column:1/-1">Плейлисты скрыты</div>'}
function cnt(){[["fn","cn1",32],["fu","cn2",12],["fa","cn3",32],["fs","cn4",32]].forEach(function(a){$(a[1]).textContent=$(a[0]).value.length+"/"+a[2]})}
function drawEdit(){cnt();pal(hueOf(dr.color));
 $("vtg").textContent=dr.tg||"Не указано";$("vds").textContent=dr.ds||"Не указано";$("vsite").textContent=dr.site||"Не указано";
 $("pinslot").innerHTML=dr.pin!==null?pinHtml(tracks[dr.pin],true):'<button class="pinadd" id="pinadd">'+ic('music')+'Закрепить трек</button>';
 $("ptg").innerHTML=pls.map(function(p,i){return '<div class="tg"><div class="cv" style="background:'+p.g+'"></div><div class="t"><b>'+p.n+'</b><span>'+p.c+plr(p.c)+'</span></div><button class="swt'+(dr.on[i]?' on':'')+'" data-i="'+i+'"></button></div>'}).join("");
 $("cols").innerHTML=HUE.map(function(x){return '<button class="sw'+(dr.color===x.c?' s':'')+'" data-c="'+x.c+'" style="'+(x.c===""?'':'background:hsl('+x.h+',70%,62%)')+'">'+(dr.color===x.c?ic('check'):(x.c===""?'<span style="color:var(--onv);display:grid">'+ic('ban')+'</span>':''))+'</button>'}).join("")}
function modal(h){$("dlg").innerHTML=h;$("mask").classList.add("o")}
function closeM(){$("mask").classList.remove("o")}
var NM={tg:["Telegram","@username"],ds:["Discord","username"],site:["Сайт","https://"]};
function pickInt(k){modal('<h3>'+NM[k][0]+'</h3><div class="tf"><div class="bx"><input id="iv" placeholder=" " maxlength="64" autocapitalize="off"><label style="left:12px">'+NM[k][1]+'</label></div></div><div class="da"><button class="btn x" id="ivc">Очистить</button><button class="btn f" id="ivs">Готово</button></div>');$("iv").value=dr[k];$("iv").focus();
 $("ivc").onclick=function(){dr[k]="";closeM();drawEdit()};$("ivs").onclick=function(){dr[k]=$("iv").value.trim();closeM();drawEdit()}}
function pickTrack(){modal('<h3>Закрепить трек</h3>'+tracks.map(function(t,i){return '<div class="opt'+(dr.pin===i?' s':'')+'" data-p="'+i+'"><div class="cv" style="background:'+t.g+'"></div><div><b>'+t.t+'</b><span>'+t.a+'</span></div></div>'}).join(""))}
function openEdit(jump){dr={nick:st.nick,user:st.user,about:st.about,status:st.status,tg:st.tg,ds:st.ds,site:st.site,pin:st.pin,color:st.color,on:pls.map(function(p){return p.on})};
 $("fn").value=dr.nick;$("fu").value=dr.user;$("fa").value=dr.about;$("fs").value=dr.status;drawEdit();view(2);if(jump)setTimeout(function(){$("pinslot").scrollIntoView({behavior:"smooth",block:"center"})},60)}
function leave(){pal(hueOf(st.color));view(1)}
["fn","fu","fa","fs"].forEach(function(i){$(i).oninput=cnt});
$("edit").onclick=$("av1").onclick=function(){openEdit()};$("chg").onclick=function(){openEdit(true)};
$("back").onclick=$("b2").onclick=leave;
$("prem").onclick=function(){toast("Нужна подписка")};$("av2").onclick=function(){toast("Выбор фото — подключите загрузку")};
$("pub").onclick=function(){$("sv").textContent="Все изменения сохранены";toast("Профиль опубликован")};
document.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){pickInt(b.dataset.k)}});
$("v2").addEventListener("click",function(e){
 if(e.target.closest("#pinadd"))pickTrack();
 if(e.target.closest("#unpin")){dr.pin=null;drawEdit()}
 var s=e.target.closest(".sw");if(s){dr.color=s.dataset.c;drawEdit()}
 var t=e.target.closest(".swt");if(t){dr.on[+t.dataset.i]=!dr.on[+t.dataset.i];drawEdit()}});
$("dlg").addEventListener("click",function(e){var o=e.target.closest("[data-p]");if(o){dr.pin=+o.dataset.p;closeM();drawEdit()}});
$("mask").onclick=function(e){if(e.target===$("mask"))closeM()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM()});
$("save").onclick=function(){var n=$("fn").value.trim(),u=$("fu").value.trim().replace(/^@/,"").replace(/\s+/g,"");if(!n||!u){toast("Заполните никнейм и юзернейм");return}
 st.nick=n;st.user=u;st.about=$("fa").value.trim();st.status=$("fs").value.trim();["tg","ds","site","pin","color"].forEach(function(k){st[k]=dr[k]});
 pls.forEach(function(p,i){p.on=dr.on[i]});render();view(1);$("sv").textContent="Есть неопубликованные изменения";toast("Профиль сохранён")};
render();
</script></body></html>
